<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 17 11" shape-rendering="crispEdges">
  <rect width="17" height="11" fill="#FBF3E8"/>

  <!-- board + dome, plum body -->
  <rect x="7" y="0" width="2" height="1" fill="#5E4E86"/>
  <rect x="5" y="1" width="6" height="1" fill="#5E4E86"/>
  <rect x="3" y="2" width="10" height="1" fill="#5E4E86"/>
  <rect x="1" y="3" width="14" height="1" fill="#5E4E86"/>
  <rect x="3" y="4" width="10" height="1" fill="#5E4E86"/>
  <rect x="5" y="5" width="6" height="1" fill="#5E4E86"/>
  <rect x="5" y="6" width="6" height="1" fill="#5E4E86"/>
  <rect x="5" y="7" width="6" height="1" fill="#5E4E86"/>

  <!-- gold rim -->
  <rect x="5" y="8" width="6" height="1" fill="#E8B84C"/>

  <!-- gold tassel, hangs off the board's right point -->
  <rect x="14" y="3" width="1" height="1" fill="#E8B84C"/>
  <rect x="14" y="4" width="1" height="1" fill="#E8B84C"/>
  <rect x="14" y="5" width="1" height="1" fill="#E8B84C"/>
  <rect x="13" y="6" width="1" height="1" fill="#E8B84C"/>
  <rect x="13" y="7" width="1" height="1" fill="#E8B84C"/>
  <rect x="12" y="8" width="2" height="2" fill="#E8B84C"/>
</svg>
